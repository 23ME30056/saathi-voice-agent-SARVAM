<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi</title>
<style>
  :root {
    --bg: #faf6f0; --surface: #ffffff; --surface-2: #f3ede4; --line: #e6ddd0;
    --text: #2a2420; --muted: #7a6f66; --accent: #d4622a; --accent-ink: #ffffff;
    --ok: #2f8f5b; --ok-bg: #e3f3ea; --warn: #a96e12; --warn-bg: #fbf0dc;
    --bad: #c23b3b; --bad-bg: #fbe5e5; --agent: #fff1e5; --user: #f0ebe4;
    --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 8px 24px rgba(60, 40, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16130f; --surface: #1f1b17; --surface-2: #2a251f; --line: #3a332b;
      --text: #f1ebe4; --muted: #a69a8e; --accent: #f07a3e; --accent-ink: #1a0f08;
      --ok: #5cc48a; --ok-bg: #1d3326; --warn: #e0a948; --warn-bg: #3a2f1a;
      --bad: #ef6b6b; --bad-bg: #3d1f1f; --agent: #2e2219; --user: #2a251f;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16130f; --surface: #1f1b17; --surface-2: #2a251f; --line: #3a332b;
    --text: #f1ebe4; --muted: #a69a8e; --accent: #f07a3e; --accent-ink: #1a0f08;
    --ok: #5cc48a; --ok-bg: #1d3326; --warn: #e0a948; --warn-bg: #3a2f1a;
    --bad: #ef6b6b; --bad-bg: #3d1f1f; --agent: #2e2219; --user: #2a251f;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb27a, var(--accent)); flex: none; }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter b { color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: wait; }

  /* setup */
  #setup .card { padding: 24px; max-width: 760px; margin: 8px auto 40px; }
  #setup h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
  #setup .lede { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .grid .full { grid-column: 1 / -1; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
  label.field small { font-weight: 400; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .setup-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .setup-foot p { margin: 0; font-size: 13px; }

  /* call */
  #call { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; padding-bottom: 24px; }
  .call-pane { display: flex; flex-direction: column; height: calc(100dvh - 90px); min-height: 520px; overflow: hidden; }
  .call-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .orb { --lvl: 0; width: 46px; height: 46px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #ffb27a, var(--accent));
         box-shadow: 0 0 0 calc(4px + var(--lvl) * 14px) color-mix(in srgb, var(--accent) 22%, transparent); transition: box-shadow .08s; }
  .orb.speaking { animation: talk 1.1s ease-in-out infinite; }
  @keyframes talk { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 18%, transparent); } }
  .call-who { flex: 1; min-width: 0; }
  .call-who b { display: block; font-size: 16px; }
  .call-who span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; max-width: 95%; font-size: 13px; color: var(--bad); background: var(--bad-bg); }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .controls { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  #status { min-height: 20px; text-align: center; font-size: 13px; color: var(--muted); }
  .mic-row { display: flex; justify-content: center; }
  #mic { width: 68px; height: 68px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform .1s; }
  #mic:active { transform: scale(.96); }
  #mic.rec { background: var(--bad); color: #fff; }
  #mic:disabled { opacity: .45; cursor: wait; }
  #type-form { display: flex; gap: 8px; }
  .toggles { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { width: auto; }

  /* live checklist + report rows */
  .live { padding: 16px; align-self: start; position: sticky; top: 12px; }
  .live h3, .report h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  .live.updating h3::after { content: "updating"; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--accent); }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-note { font-size: 12.5px; color: var(--muted); }
  .chip { flex: none; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .chip.ok { color: var(--ok); background: var(--ok-bg); }
  .chip.warn { color: var(--warn); background: var(--warn-bg); }
  .chip.bad { color: var(--bad); background: var(--bad-bg); }
  .chip.idle { color: var(--muted); background: var(--surface-2); }
  .alerts { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
  .alerts b { display: block; margin-bottom: 2px; }
  .alerts ul { margin: 0; padding-left: 18px; }

  /* report */
  .report { padding: 24px; max-width: 760px; margin: 8px auto 40px; }
  .report h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .report .date { margin: 2px 0 16px; color: var(--muted); font-size: 13px; }
  .report .summary { font-size: 16px; margin: 0 0 18px; }
  .report section { margin-top: 20px; }
  .report ul.actions { margin: 0; padding-left: 20px; }
  .memory { margin: 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--agent); border-radius: 0 12px 12px 0; font-style: italic; }
  .report-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  details { margin-top: 20px; font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); }
  details p { margin: 6px 0; }

  @media (max-width: 820px) {
    #call { grid-template-columns: 1fr; }
    .call-pane { height: 72dvh; min-height: 440px; }
    .live { position: static; }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    #setup .card, .report { padding: 18px; }
    .brand p { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div><h1 id="app-name">Saathi</h1><p id="tagline"></p></div>
    </div>
    <div class="meter" id="meter" title="Estimated Sarvam credits used by this app (check dashboard.sarvam.ai for the real balance)">est. <b>₹0.00</b></div>
  </header>

  <!-- 1. Setup -->
  <main id="setup">
    <form class="card" id="setup-form">
      <h2>Who should Saathi call today?</h2>
      <p class="lede">Saathi checks in on mood, meals, medicines and health, warns about scams, and sends the family a report after the call.</p>
      <div class="grid">
        <label class="field">Name <input name="name" required></label>
        <label class="field">Saathi calls them <input name="call_them" placeholder="e.g. Amma, Dadi, Kamla ji"></label>
        <label class="field">Age <input name="age" inputmode="numeric"></label>
        <label class="field">Language <select name="language" id="language"></select></label>
        <label class="field full">Medicines <small>One per line: name, what it's for, when</small><textarea name="medicines" rows="3"></textarea></label>
        <label class="field full">About them <small>Anything that helps Saathi talk like it knows them</small><textarea name="notes" rows="2"></textarea></label>
        <label class="field">Family to update <input name="family"></label>
        <label class="field">Saathi's voice <select name="voice" id="voice"></select></label>
      </div>
      <div class="setup-foot">
        <p class="muted">A typical call is 8 to 10 replies and costs about ₹4 to ₹6 in Sarvam credits.</p>
        <button class="btn primary" id="start-btn">Start today's call</button>
      </div>
    </form>
  </main>

  <!-- 2. Call -->
  <main id="call" hidden>
    <div class="card call-pane">
      <div class="call-head">
        <div class="orb" id="orb" aria-hidden="true"></div>
        <div class="call-who"><b id="callee"></b><span id="timer">00:00</span></div>
        <button class="btn danger" id="end-btn">End call</button>
      </div>
      <div id="chat" aria-live="polite"></div>
      <div class="controls">
        <div id="status"></div>
        <div class="mic-row">
          <button id="mic" aria-label="Talk (Space)" title="Tap to talk, tap again to send (or press Space)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
          </button>
        </div>
        <form id="type-form">
          <input id="type-input" type="text" placeholder="Or type as the elder (saves credits)" autocomplete="off">
          <button class="btn">Send</button>
        </form>
        <div class="toggles">
          <label><input type="checkbox" id="speak" checked> Voice replies</label>
          <label><input type="checkbox" id="handsfree" checked> Hands-free (auto-listen after Saathi speaks)</label>
        </div>
      </div>
    </div>
    <aside class="card live" id="live">
      <h3>Live check-in</h3>
      <div id="live-alerts"></div>
      <div class="rows" id="live-rows"></div>
    </aside>
  </main>

  <!-- 3. Family report -->
  <main id="report" hidden>
    <article class="card report" id="report-body"></article>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const SPEECH_RMS = 0.012, SILENCE_MS = 1300, MAX_SECONDS = 25, MIN_SECONDS = 0.5, GIVE_UP_SECONDS = 12;
const LANG_NAMES = { 'hi-IN': 'Hindi', 'en-IN': 'English', 'bn-IN': 'Bengali', 'mr-IN': 'Marathi', 'ta-IN': 'Tamil', 'te-IN': 'Telugu',
  'kn-IN': 'Kannada', 'ml-IN': 'Malayalam', 'gu-IN': 'Gujarati', 'pa-IN': 'Punjabi', 'od-IN': 'Odia' };
const TONE = { good: 'ok', taken: 'ok', none: 'ok', okay: 'warn', mild: 'warn', due_later: 'idle',
  low: 'bad', poor: 'bad', missed: 'bad', red_flag: 'bad', suspected: 'bad', unknown: 'idle' };
const LABEL = { good: 'Good', okay: 'Okay', low: 'Low', poor: 'Poor', taken: 'Taken', missed: 'Missed', due_later: 'Due later',
  none: 'None', mild: 'Mild', red_flag: 'Red flag', suspected: 'Scam suspected', unknown: 'Not yet' };

const S = { cfg: null, sid: null, profile: null, busy: false, ended: true, transcript: [], insights: null, insightsSeq: 0, callStart: 0, timer: 0 };
const rec = { stream: null, ctx: null, analyser: null, recorder: null, chunks: [], started: 0, heard: false, lastLoud: 0, floor: Infinity, poll: 0, manual: false, discard: false };
let player = null;

// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const voiceOn = () => $('#speak').checked;
const secs = (ms) => (ms / 1000).toFixed(1) + 's';

async function api(url, opts) {
  const r = await fetch(url, opts);
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : `${r.status} ${r.statusText}`);
  return data;
}
function show(id) { for (const s of ['setup', 'call', 'report']) $('#' + s).hidden = s !== id; }
function setStatus(t) { $('#status').textContent = t; }
function setMicEnabled(on) { $('#mic').disabled = !on; }
function showSpent(spent) {
  if (typeof spent !== 'number') return;
  $('#meter').innerHTML = `est. <b>₹${spent.toFixed(2)}</b> / ₹${S.cfg.budget}`;
}
function addMsg(kind, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.textContent = text;
  if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  $('#chat').appendChild(d);
  $('#chat').scrollTop = $('#chat').scrollHeight;
}
function metaFor(d) {
  const t = d.ms || {};
  return [t.stt != null && `heard ${secs(t.stt)}`, t.llm != null && `think ${secs(t.llm)}`, t.tts != null && `voice ${secs(t.tts)}`]
    .filter(Boolean).join(' · ');
}
function medsFromProfile() {
  return (S.profile?.medicines || '').split('\n').map((l) => l.split(/\s[-–—]\s/)[0].trim()).filter(Boolean)
    .map((name) => ({ name, status: 'unknown' }));
}
function callee() { return S.profile.call_them || S.profile.name; }

// ---------- setup ----------
async function init() {
  S.cfg = await api('/api/config');
  $('#app-name').textContent = S.cfg.name;
  $('#tagline').textContent = S.cfg.tagline;
  showSpent(S.cfg.spent);
  $('#language').innerHTML = S.cfg.languages.map((l) => `<option>${esc(l)}</option>`).join('');
  $('#voice').innerHTML = S.cfg.voices.map(({ id, gender }) =>
    `<option value="${esc(id)}">${esc(id[0].toUpperCase() + id.slice(1))} (${esc(gender)})</option>`).join('');
  const profile = { ...S.cfg.profile, ...(load('saathi-profile') || {}) };
  for (const [k, v] of Object.entries(profile)) {
    const el = $('#setup-form').elements[k];
    if (el) el.value = v;
  }
}

$('#setup-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const profile = Object.fromEntries(new FormData(e.target).entries());
  save('saathi-profile', profile);
  profile.local_time = new Date().toLocaleString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
  S.profile = profile; S.transcript = []; S.insights = null; S.ended = false; S.sid = null;
  $('#chat').innerHTML = '';
  $('#callee').textContent = callee();
  $('#timer').textContent = 'Ringing…';
  renderLive(null);
  show('call');
  ensureMic().catch(() => {}); // ask for mic permission now, while we have a user gesture
  exchange('start', () => api('/api/call/start?speak=' + voiceOn(), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profile),
  }));
});

// ---------- one conversational exchange ----------
async function exchange(kind, request) {
  S.busy = true; setMicEnabled(false);
  setStatus(kind === 'start' ? 'Calling…' : kind === 'voice' ? 'Listening to you… thinking…' : 'Thinking…');
  let data;
  try { data = await request(); }
  catch (err) { addMsg('error', err.message); setStatus(''); return; }
  finally { S.busy = false; setMicEnabled(true); }
  if (S.ended) return;

  if (kind === 'start') { S.sid = data.session_id; startTimer(); }
  if (kind === 'voice') {
    if (!data.user_text) { setStatus("Couldn't catch that. Tap the mic and try again."); return; }
    addMsg('user', data.user_text, LANG_NAMES[data.user_lang] || '');
    S.transcript.push({ who: callee(), text: data.user_text });
  }
  if (data.reply) { addMsg('agent', data.reply, metaFor(data)); S.transcript.push({ who: 'Saathi', text: data.reply }); }
  if (data.tts_error) addMsg('error', data.tts_error);
  showSpent(data.spent);
  if (kind !== 'start') refreshInsights();

  let how = 'none';
  if (data.audio?.length) {
    setStatus('Saathi is speaking… (tap the mic to interrupt)');
    for (const clip of data.audio) {
      how = await play(clip, data.audio_mime);
      if (how === 'interrupted' || S.ended) break;
    }
  }
  if (how === 'interrupted' || S.ended) return;
  setStatus('');
  if ($('#handsfree').checked) startListening();
  else setStatus('Tap the mic to reply');
}

function play(b64, mime) {
  return new Promise((resolve) => {
    const a = new Audio(`data:${mime};base64,${b64}`);
    const done = (how) => { if (player === a) { player = null; $('#orb').classList.remove('speaking'); } a.onended = a.onerror = null; resolve(how); };
    a.onended = () => done('ended');
    a.onerror = () => done('error');
    a.stop = () => { a.pause(); done('interrupted'); };
    player = a;
    $('#orb').classList.add('speaking');
    a.play().catch(() => done('error'));
  });
}
function stopPlayback() { player?.stop(); }

// ---------- microphone with simple voice-activity detection ----------
async function ensureMic() {
  if (rec.stream) return;
  rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  rec.ctx = new AudioContext();
  rec.analyser = rec.ctx.createAnalyser();
  rec.analyser.fftSize = 1024;
  rec.ctx.createMediaStreamSource(rec.stream).connect(rec.analyser);
}

async function startListening() {
  if (S.busy || S.ended || !S.sid || rec.recorder?.state === 'recording') return;
  stopPlayback();
  try { await ensureMic(); } catch { setStatus('Microphone is blocked. Allow mic access, or type below.'); return; }
  if (rec.ctx.state === 'suspended') await rec.ctx.resume();
  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find((t) => MediaRecorder.isTypeSupported(t));
  const r = rec.recorder = new MediaRecorder(rec.stream, type ? { mimeType: type } : {});
  Object.assign(rec, { chunks: [], heard: false, manual: false, discard: false, floor: Infinity, started: performance.now() });
  rec.lastLoud = rec.started;
  r.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
  r.onstop = onRecorded;
  r.start();
  $('#mic').classList.add('rec');
  setStatus('Listening… start talking');

  const buf = new Float32Array(rec.analyser.fftSize);
  rec.poll = setInterval(() => {
    rec.analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length), now = performance.now(), t = (now - rec.started) / 1000;
    $('#orb').style.setProperty('--lvl', Math.min(rms * 14, 1).toFixed(3));
    if (t > 0.1) rec.floor = Math.min(rec.floor, rms);
    if (rms > Math.max(SPEECH_RMS, rec.floor * 3)) { rec.heard = true; rec.lastLoud = now; }
    if (rec.heard) setStatus(`Listening… ${Math.floor(t)}s (pause to send)`);
    if ((rec.heard && now - rec.lastLoud > SILENCE_MS) || t > MAX_SECONDS || (!rec.heard && t > GIVE_UP_SECONDS)) stopListening();
  }, 50);
}

function stopListening(discard = false) {
  clearInterval(rec.poll);
  rec.discard = discard;
  if (rec.recorder?.state === 'recording') rec.recorder.stop();
  $('#mic').classList.remove('rec');
  $('#orb').style.setProperty('--lvl', 0);
}

function onRecorded() {
  if (rec.discard || S.ended) return;
  const t = (performance.now() - rec.started) / 1000;
  if (t < MIN_SECONDS || !(rec.heard || rec.manual)) { setStatus("Didn't hear anything. Tap the mic to talk."); return; }
  const fd = new FormData();
  fd.append('session_id', S.sid);
  fd.append('speak', voiceOn());
  fd.append('duration', t.toFixed(2));
  fd.append('audio', new Blob(rec.chunks, { type: rec.recorder.mimeType || 'audio/webm' }), 'speech');
  exchange('voice', () => api('/api/turn', { method: 'POST', body: fd }));
}

$('#mic').addEventListener('click', () => {
  if (rec.recorder?.state === 'recording') { rec.manual = true; stopListening(); }
  else startListening();
});
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || $('#call').hidden || e.target.closest('input, textarea, select, button')) return;
  e.preventDefault();
  $('#mic').click();
});

$('#type-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#type-input').value.trim();
  if (!text || S.busy || !S.sid) return;
  $('#type-input').value = '';
  stopListening(true); stopPlayback();
  addMsg('user', text);
  S.transcript.push({ who: callee(), text });
  const fd = new FormData();
  fd.append('session_id', S.sid);
  fd.append('speak', voiceOn());
  fd.append('text', text);
  exchange('text', () => api('/api/turn', { method: 'POST', body: fd }));
});

// ---------- live checklist ----------
function row(title, item) {
  const st = item?.status || 'unknown';
  return `<div class="row"><div><div class="row-title">${esc(title)}</div>${item?.note ? `<div class="row-note">${esc(item.note)}</div>` : ''}</div>
    <span class="chip ${TONE[st] || 'idle'}">${esc(LABEL[st] || st)}</span></div>`;
}
function rowsHTML(d) {
  d = d || {};
  const meds = (d.medicines?.length ? d.medicines : medsFromProfile()).map((m) => row(m.name, m)).join('');
  return row('Mood', d.mood) + row('Sleep', d.sleep) + row('Meals', d.meals) + meds + row('Health', d.symptoms) + row('Scam check', d.scam);
}
function alertsHTML(d) {
  const list = d?.alerts?.filter(Boolean) || [];
  return list.length ? `<div class="alerts"><b>Alert for ${esc(S.profile.family || 'family')}</b><ul>${list.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>` : '';
}
function renderLive(d) {
  $('#live-rows').innerHTML = rowsHTML(d);
  $('#live-alerts').innerHTML = alertsHTML(d);
}

async function refreshInsights() {
  const seq = ++S.insightsSeq;
  $('#live').classList.add('updating');
  try {
    const fd = new FormData();
    fd.append('session_id', S.sid);
    const { insights, spent } = await api('/api/insights', { method: 'POST', body: fd });
    showSpent(spent);
    if (seq !== S.insightsSeq) return; // a newer update is on its way
    S.insights = insights;
    if (!S.ended) renderLive(insights);
  } catch { /* the live panel is best-effort */ }
  finally { if (seq === S.insightsSeq) $('#live').classList.remove('updating'); }
}

// ---------- end of call: family report ----------
function startTimer() {
  S.callStart = Date.now();
  clearInterval(S.timer);
  S.timer = setInterval(() => {
    const s = Math.floor((Date.now() - S.callStart) / 1000);
    $('#timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 500);
}

$('#end-btn').addEventListener('click', async () => {
  S.ended = true;
  stopListening(true); stopPlayback(); clearInterval(S.timer);
  show('report');
  if (!S.sid) { renderReportError('The call never connected.'); return; }
  $('#report-body').innerHTML = `<h2>Writing the report for ${esc(S.profile.family || 'the family')}…</h2><p class="muted">Reading through the call.</p>`;
  S.insightsSeq++;
  try {
    const fd = new FormData();
    fd.append('session_id', S.sid);
    const { insights, spent } = await api('/api/insights', { method: 'POST', body: fd });
    showSpent(spent);
    renderReport(insights);
  } catch (err) {
    if (S.insights) renderReport(S.insights); else renderReportError(err.message);
  }
});

function shareText(d) {
  const line = (t, i) => `${t}: ${LABEL[i?.status] || 'Not discussed'}${i?.note ? ' (' + i.note + ')' : ''}`;
  const parts = [
    `*Saathi check-in: ${callee()}* (${new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })})`,
    d.summary || '', '',
    line('Mood', d.mood), line('Sleep', d.sleep), line('Meals', d.meals),
    ...(d.medicines || []).map((m) => line(m.name, m)),
    line('Health', d.symptoms), line('Scam check', d.scam),
  ];
  if (d.memory) parts.push('', `Memory of the day: ${d.memory}`);
  if (d.alerts?.length) parts.push('', '⚠️ ' + d.alerts.join('\n⚠️ '));
  if (d.family_actions?.length) parts.push('', 'Suggested: ' + d.family_actions.join('; '));
  return parts.join('\n');
}

function renderReport(d) {
  const actions = d.family_actions?.filter(Boolean) || [];
  $('#report-body').innerHTML = `
    <h2>${esc(callee())}'s check-in</h2>
    <p class="date">${esc(new Date().toLocaleString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }))}
      · ${esc($('#timer').textContent)} call · for ${esc(S.profile.family || 'the family')}</p>
    ${alertsHTML(d)}
    <p class="summary">${esc(d.summary || 'No summary available.')}</p>
    ${d.memory ? `<section><h3>Memory of the day</h3><blockquote class="memory">${esc(d.memory)}</blockquote></section>` : ''}
    <section><h3>Today</h3><div class="rows">${rowsHTML(d)}</div></section>
    ${actions.length ? `<section><h3>Suggested next steps</h3><ul class="actions">${actions.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></section>` : ''}
    <div class="report-btns">
      <a class="btn primary" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText(d))}">Send on WhatsApp</a>
      <button class="btn" id="copy-btn">Copy report</button>
      <button class="btn" id="again-btn">New call</button>
    </div>
    <details><summary>Call transcript (${S.transcript.length} lines)</summary>
      ${S.transcript.map((m) => `<p><b>${esc(m.who)}:</b> ${esc(m.text)}</p>`).join('')}
    </details>`;
  $('#copy-btn').onclick = async () => {
    try { await navigator.clipboard.writeText(shareText(d)); $('#copy-btn').textContent = 'Copied'; } catch { $('#copy-btn').textContent = 'Copy failed'; }
  };
  $('#again-btn').onclick = () => show('setup');
}
function renderReportError(msg) {
  $('#report-body').innerHTML = `<h2>No report</h2><p class="muted">${esc(msg)}</p><div class="report-btns"><button class="btn" id="again-btn">Back</button></div>`;
  $('#again-btn').onclick = () => show('setup');
}

init().catch((err) => { document.body.insertAdjacentHTML('afterbegin', `<p class="msg error">Couldn't reach the server: ${esc(err.message)}</p>`); });
</script>
</body>
</html>
